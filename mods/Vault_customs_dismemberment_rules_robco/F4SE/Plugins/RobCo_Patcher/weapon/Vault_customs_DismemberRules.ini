// Vault_customs - правила расчленения по типу оружия (RobCo Patcher, секция weapon)
// Работает в паре с плагином "Vault_customs_dismemberment_tuning" (GMST):
//   тот решает, КОГДА возможен отрыв (только при сильном перебое урона),
//   а этот файл — КАКОЕ оружие вообще имеет на это право.
// Значения: nodismemberorexplode | dismemberonly | explodeonly
// Правила читаются сверху вниз, более поздние перекрывают более ранние;
// там, где это возможно, добавлены явные исключения, чтобы не зависеть от порядка.

// ---------------------------------------------------------------------------
// 1. НЕ РВЁТ: всё энергетическое.
//    Лазер, плазма, гамма, гатлинг-лазер, инопланетный бластер, лазерный
//    мушкет, огнемёт, криолятор, сигнальный пистолет, шприцемёт, мусоромёт.
//    Испарение при критах остаётся — его делает CROSS Crit Gore-verhaul
//    через крит-заклинания, мимо системы расчленения.
// ---------------------------------------------------------------------------
filterByKeywordsOr=Fallout4.esm|00092A84,Fallout4.esm|00092A85,Fallout4.esm|00225762,Fallout4.esm|0022575E,Fallout4.esm|0016968B,Fallout4.esm|00226452,Fallout4.esm|00225760,Fallout4.esm|0022575F,Fallout4.esm|00225761,Fallout4.esm|00225765,Fallout4.esm|00225763:weaponHitType=nodismemberorexplode

// ---------------------------------------------------------------------------
// 2. НЕ РВЁТ: ближний бой и рукопашная, кроме поимённых списков ниже.
//    Ножи, выкидухи, биты, трубы, кастеты, дубинки, трости.
// ---------------------------------------------------------------------------
filterByKeywordsOr=Fallout4.esm|0004A0A4,Fallout4.esm|0004A0A5,Fallout4.esm|0005240E,Fallout4.esm|00226453:filterByWeaponsExcluded=Fallout4.esm|000FF964,Fallout4.esm|000E7AB9,Fallout4.esm|0011B336,Fallout4.esm|00144A6C,Fallout4.esm|0005DF2E,Fallout4.esm|0024A3AE,Fallout4.esm|0024A3AF,DLCNukaWorld.esm|01046A29,Fallout4.esm|00033FE0,Fallout4.esm|00143AB5,Fallout4.esm|00147BE4,Fallout4.esm|00183FCD,Fallout4.esm|000FA2FB,Fallout4.esm|000FA2F6,Fallout4.esm|000D8576,Fallout4.esm|000C2C2A,DLCCoast.esm|01009582,Fallout4.esm|00092A61,Fallout4.esm|000EDCED,Fallout4.esm|000EDCEC,Fallout4.esm|002216CF,Fallout4.esm|002216D0,Fallout4.esm|002216D1,Fallout4.esm|00210B62,Fallout4.esm|00210B63,DLCRobot.esm|01008B8E,DLCRobot.esm|010020F8,DLCRobot.esm|0100272B,DLCRobot.esm|0100272C,DLCRobot.esm|01011117,DLCRobot.esm|01011118,DLCRobot.esm|01010A59,DLCRobot.esm|01010A5A,DLCRobot.esm|0101110D,DLCRobot.esm|0101110E:weaponHitType=nodismemberorexplode

// ---------------------------------------------------------------------------
// 3. НЕ РВЁТ: обычная баллистика — пистолеты, автоматы, трубчатое оружие.
//    Исключены категории и стволы из правил 4-6.
// ---------------------------------------------------------------------------
filterByKeywordsOr=Fallout4.esm|00092A86:filterByKeywordsExcluded=Fallout4.esm|00226454,Fallout4.esm|0022575D,Fallout4.esm|00226456,Fallout4.esm|00225764,Fallout4.esm|001E325D,Fallout4.esm|00225766:filterByWeaponsExcluded=Fallout4.esm|000CE97D,Fallout4.esm|00148B40,Fallout4.esm|00148B45,DLCNukaWorld.esm|0105221E,DLCNukaWorld.esm|010415B3,HuntingRevolver.esp|02000F99,HuntingRevolver.esp|02004521,GaussRevolver.esp|03000860,DakRevolverRifle.esp|04037772,LunarArsenal.esp|0D237941:weaponHitType=nodismemberorexplode

// ---------------------------------------------------------------------------
// 4. РАЗРЫВАЕТ: дробовики, миниган, гаусс, костыльная, снайперские,
//    "Бортовой залп".
// ---------------------------------------------------------------------------
filterByKeywordsOr=Fallout4.esm|00226454,Fallout4.esm|0022575D,Fallout4.esm|00226456,Fallout4.esm|00225764,Fallout4.esm|001E325D,Fallout4.esm|00225766:weaponHitType=explodeonly

// ---------------------------------------------------------------------------
// 5. РАЗРЫВАЕТ: всё, что стреляет тем же патроном, что ванильный .44
//    и рычажный карабин Far Harbor (.45-70). Ловит и оружие из модов.
// ---------------------------------------------------------------------------
filterByHasAmmoFromWeaponList=Fallout4.esm|000CE97D,DLCCoast.esm|0102C8B0:weaponHitType=explodeonly

// ---------------------------------------------------------------------------
// 6. РАЗРЫВАЕТ: крупнокалиберные револьверы поимённо.
//    Ванильный .44, .44 Адептов, "Западный" револьвер, револьверы Гатси,
//    модовые Hunting Revolver (+уникальный), Gauss Revolver,
//    Dak Revolver Rifle, AVMagnum из LunarArsenal.
//    Трубчатый револьвер и CWScrapRevolver сюда НЕ входят — мелкий калибр.
// ---------------------------------------------------------------------------
filterByWeapons=Fallout4.esm|000CE97D,Fallout4.esm|00148B40,Fallout4.esm|00148B45,DLCNukaWorld.esm|0105221E,DLCNukaWorld.esm|010415B3,HuntingRevolver.esp|02000F99,HuntingRevolver.esp|02004521,GaussRevolver.esp|03000860,DakRevolverRifle.esp|04037772,LunarArsenal.esp|0D237941:weaponHitType=explodeonly

// ---------------------------------------------------------------------------
// 7. РАЗРЫВАЕТ: тяжёлое дробящее.
//    Кувалда, супер-кувалда, силовой кулак, якорь, кувалда Силача.
// ---------------------------------------------------------------------------
filterByWeapons=Fallout4.esm|000FF964,Fallout4.esm|000E7AB9,Fallout4.esm|0011B336,Fallout4.esm|00144A6C,Fallout4.esm|0005DF2E,Fallout4.esm|0024A3AE,Fallout4.esm|0024A3AF,DLCNukaWorld.esm|01046A29:weaponHitType=explodeonly

// ---------------------------------------------------------------------------
// 8. ОТРУБАЕТ: длинное режущее.
//    Мачете, сабля, китайский офицерский меч, топор Грогнака, шиш-кебаб,
//    риппер, багор, гаунтлет и когти когтя смерти.
//    Ножи и выкидухи сюда НЕ входят.
// ---------------------------------------------------------------------------
filterByWeapons=Fallout4.esm|00033FE0,Fallout4.esm|00143AB5,Fallout4.esm|00147BE4,Fallout4.esm|00183FCD,Fallout4.esm|000FA2FB,Fallout4.esm|000FA2F6,Fallout4.esm|000D8576,Fallout4.esm|000C2C2A,DLCCoast.esm|01009582:weaponHitType=dismemberonly

// ---------------------------------------------------------------------------
// 9. ОТРУБАЕТ: пилы и клинки роботов (оружие врагов).
// ---------------------------------------------------------------------------
filterByWeapons=Fallout4.esm|00092A61,Fallout4.esm|000EDCED,Fallout4.esm|000EDCEC,Fallout4.esm|002216CF,Fallout4.esm|002216D0,Fallout4.esm|002216D1,Fallout4.esm|00210B62,Fallout4.esm|00210B63,DLCRobot.esm|01008B8E,DLCRobot.esm|010020F8,DLCRobot.esm|0100272B,DLCRobot.esm|0100272C,DLCRobot.esm|01011117,DLCRobot.esm|01011118,DLCRobot.esm|01010A59,DLCRobot.esm|01010A5A,DLCRobot.esm|0101110D,DLCRobot.esm|0101110E:weaponHitType=dismemberonly


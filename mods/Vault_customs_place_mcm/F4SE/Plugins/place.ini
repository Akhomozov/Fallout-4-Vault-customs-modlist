;; Настройки мода Place Everywhere (place.dll).
;; Файл читается один раз при запуске игры, поэтому любые изменения
;; вступают в силу только после перезапуска.
;; Справка по всем параметрам: mods\Place Everywhere\F4SE\Plugins\place_ini_help.txt


[main]
togglable = 0
wheelRotation = Off
timeoutFrozen = Off
snapDisabled = Off
groundDisabled = On
outlineDisabled = On
extraOutlineEnabled = Off
autoTimescaleEnabled = Off
buildTimescale = 0.010000
globalMove = Off


[dangerous]
deleteEnabled = Off


[cheats]
duplicateEnabled = Off


[steps]
rotateStepIdx = 3
rotateSteps = 0.1 0.5 1 5 15 45 90
moveStepIdx = 3
moveSteps = 0.1 0.5 1 5 10 50 100
scaleStepIdx = 3
scaleSteps = 1 5 10 25 50


[keys]
main = 0x77
snap = 0x70
ground = 0x71
workshopSnap = 0x72
outlineToggle = 0x73
extraOutlineToggle = 0x2D
timeoutFreeze = 0x74
clampedStoreToggle = 0x75
lockObject = 0x76
rotateStepMinus = 0x6D
rotateStepPlus = 0x6B
resetAngles = 0x60
removeTremor = 0x65
changeRotateAxis = 0x11
moveDown = 0x62
moveUp = 0x68
moveLeft = 0x64
moveRight = 0x66
moveBack = 0x67
moveForth = 0x69
moveStepMinus = 0x6F
moveStepPlus = 0x6a
scaleStepMinus = 0x22
scaleStepPlus = 0x21
scaleDown = 0x61
scaleUp = 0x63
scaleReset = 0x6E
undo = 0x08
copyState = 0xBB
copyPosX = 0x31
copyPosY = 0x32
copyPosZ = 0x33
copyAngleX = 0x34
copyAngleY = 0x35
copyAngleZ = 0x36
copyScale = 0x37
copyAll = 0x30
deleteKey = 0x2E
duplicateKey = 0xBF
rotateLeft = 0xBC
rotateRight = 0xBE
physicsOn = 0x24
physicsOff = 0x23
timescaleToggle = 0x7A
globalMoveToggle = 0xA4


[messages]
snapOn = Привязка к объектам вкл.
snapOff = Привязка к объектам выкл.
groundOn = Привязка к поверхности вкл.
groundOff = Привязка к поверхности выкл.
workshopOn = Привязка к сетке мастерской вкл.
workshopOff = Привязка к сетке мастерской выкл.
freezeOn = Таймаут мастерской выключен
freezeOff = Таймаут мастерской включён
placeOn = Свободное размещение вкл.
placeOff = Свободное размещение выкл.
rotateStepChange = Шаг поворота: %0.1f
moveStepChange = Шаг перемещения: %0.1f
scaleStepChange = Шаг масштаба: %d%%
axisChange = Ось поворота: %c
outlineOn = Подсветка объекта вкл.
outlineOff = Подсветка объекта выкл.
scaleChange = Масштаб: %d%%
clampedStoreOn = Прикреплённые объекты убираются в мастерскую
clampedStoreOff = Прикреплённые объекты не убираются
lockObjectOn = Объект закреплён
lockObjectOff = Объект откреплён
extraOutlineOff = Выбор дополнительных объектов выкл.
extraOutlineOn = Выбор дополнительных объектов вкл.
physicsOn = Физика объекта вкл.
physicsOff = Физика объекта выкл.
timescaleOff = Обычная скорость времени
timescaleOn = Время замедлено
globalMoveOff = Движение относительно игрока
globalMoveOn = Движение по осям мира
paramsSaved = Параметры объекта сохранены


[Main]

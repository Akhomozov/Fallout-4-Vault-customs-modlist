; Значения по умолчанию для меню MCM.
; Совпадают с тем, что лежит в F4SE\Plugins\place.ini при установке мода.

[Main]
bSnapDisabled=0
bGroundDisabled=0
bOutlineDisabled=0
bExtraOutline=0
bTimeoutFrozen=0
bWheelRotation=0
bGlobalMove=0
bAutoTimescale=0
iTogglable=0
fBuildTimescale=0.01

[Steps]
; номер пункта в списке, считая с нуля
iRotateStepIdx=2
iMoveStepIdx=2
iScaleStepIdx=2

[Keys]
; номер клавиши в списке: 0=F1, 1=F2, ... 11=F12, 12=Insert, 13=Home,
; 14=End, 15=Page Up, 16=Page Down, 17=Delete, 18=не назначена
iKeySnap=0
iKeyGround=1
iKeyWorkshopSnap=2
iKeyOutline=3
iKeyTimeoutFreeze=4
iKeyClampedStore=5
iKeyLockObject=6
iKeyMain=7
iKeyTimescale=10

[Dangerous]
bDeleteEnabled=0

[Cheats]
bDuplicateEnabled=0

[Settings]
; 1 = подменять меш ядра пустышкой, 0 = выключить
enabled = 1

; сколько ПЕРВЫХ запросов меша подменить пустышкой.
; движок за одну вставку просит меш дважды: 1 гасит вспышку, следующий приносит
; настоящее ядро. Если вспышка осталась — пробовать 2, если ядро не появляется — 0.
hide_count = 1

; за сколько мс запросы считаются одной вставкой
window_ms = 2000

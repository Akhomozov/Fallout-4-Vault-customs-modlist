[Settings]
; 1 = пока игрок в силовой броне, бег не тратит очки действия
enabled = 1

; как часто сверять, в броне ли игрок и ускоряется ли (мс).
; Реже - дешевле, но дольше переключение; на спринт нужен шаг помельче
poll_ms = 100

; какое значение fSprintActionPointsDrainMult держать в броне.
; 0 = бег бесплатен. Вне брони всегда возвращается значение из порядка загрузки (ваниль 12)
drain_in_pa = 0

; 1 = на время ускорения в броне поднимать расход ядра.
; 0 = расход одинаковый на любом беге, как было до 22.09.2026
sprint_core_drain = 1

; сколько заряда в секунду тратить на ускорении в броне.
; Обычный бег берёт ставку из esp (fPowerArmorPowerDrainPerSecondRunning, у нас 0.05 - ваниль)
sprint_core_drain_value = 0.15

; 1 = писать в лог каждое переключение спринта. Только для разбора, спамит
log_sprint = 0

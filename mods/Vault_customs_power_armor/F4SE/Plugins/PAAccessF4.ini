[Settings]
; 0 — плагин не скрывает виджет. Передача по R доступна при любом значении.
enabled = 1

; 1 — скрывать список частей любой рамы, в том числе рядом со стойкой.
; 0 — показывать список. Полноэкранное меню передачи по R не блокируется.
hide_quick_widget = 1

; сколько миллисекунд держать список скрытым после того, как движок сбросил
; режим быстрого контейнера. Режим мигает, и без этой задержки список мелькает
hold_ms = 800

; на каком расстоянии от рамы держать список скрытым. Состояние быстрого
; контейнера движок то и дело обнуляет и возвращает, поэтому судим по дистанции
; до рамы, а не по нему
keep_hidden_range = 600

; устаревшая настройка радиуса стойки; с v0.2 не влияет на HUD и передачу по R
radius = 400

; 1 — один раз за сессию выписать в лог всё дерево HUD с видимостью клипов.
; Нужно, только если список частей перестал прятаться: по дереву видно, какой
; клип рисуется на самом деле
dump_hud = 0

; 1 — писать в лог каждое открытие и закрытие любого меню. Только для разбора,
; в обычной игре лог пухнет
log_all_menus = 0

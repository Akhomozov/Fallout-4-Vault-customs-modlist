[General]

; Menu toggle key for keyboard
ToggleKey = F1

; SinglePress, Hold, DoublePress, OFF
ToggleMode = SINGLEPRESS

; Menu toggle key for Gamepad
ToggleKeyGamePad = DPAD_UP

; SinglePress, Hold, DoublePress, OFF
ToggleModeGamePad = HOLD
FreezeTimeOnMenu = false
BlurBackgroundOnMenu = false
MenuStyle = FALLOUT4_HIGHVIS_WHITE
PauseMenuButtonPos = 0


[Fonts]
PrimaryFont = FalloutMenuFont.ttf
EnableChinese = false
EnableJapanese = false
EnableKorean = false
EnableCyrillic = true
EnableThai = false
FontSizeSmall = 16.000000
FontSizeMedium = 32.000000
FontSizeBig = 64.000000


[MCMCompat]
Enabled = true
MCMCompatWhenNativePresent = true
ShowCategorizerEditorAlways = false


[Gamepad]
GlyphStyle = playstation
DisableKeyboardInput = false


[Localization]
AutoTranslate = true
CaptureStrings = false

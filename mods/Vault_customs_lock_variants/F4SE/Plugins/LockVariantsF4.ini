; Vault_customs Lock Variants: какой замок показывать при взломе.
;
; --- Остановка перед взломом
; Персонаж полностью останавливается в момент открытия меню. Иначе остаточное
; движение мелко трясёт замок и шпильку. 1 - останавливать, 0 - нет.
stop_player = 1
;
; --- Перехваты (для поиска причин; в обычной работе оба включены)
hook_open   = 1
hook_demand = 1
;
; --- Правила
;
; Читаются сверху вниз, выигрывает первое совпавшее. Что можно писать слева:
;   type:DOOR       тип объекта: DOOR (дверь), CONT (контейнер), TERM, ACTI, FURN
;   model:toolbox   кусок пути к модели самого объекта, регистр не важен
;   form:Fallout4.esm|001A037F   один конкретный объект: плагин и номер формы
;
; Справа - модель замка. Их пять:
;   LockPickLock01 - база, сильно ржавая, в разводах (Seen some shit)
;   LockPickLockV1 - тёмная сталь без клейма, ровная, без ржавчины (HQLIR)
;   LockPickLockV2 - ржаво-коричневая с красной сердцевиной (HD Lockpick Interface Retexture)
;   LockPickLockV3 - почти чёрная, в царапинах, армейская (Lockpicking Retextured)
;   LockPickLockV4 - серая сталь с клеймом Safe-T-Locko (HD LockPick Interface)
;
; Отвёртка со шпилькой всегда базовая, вариантами не меняется.
; Какие объекты попадаются - видно в GameLogs\F4SE\LockVariantsF4.log.

; --- по конкретным вещам
model:safefloor = Interface/Lockpicking/LockPickLockV4.nif
model:suitcase  = Interface/Lockpicking/LockPickLockV2.nif
model:toolbox   = Interface/Lockpicking/LockPickLockV3.nif
model:ammo      = Interface/Lockpicking/LockPickLockV3.nif

; --- двери по характеру места
model:hightech  = Interface/Lockpicking/LockPickLockV1.nif
model:vault     = Interface/Lockpicking/LockPickLockV4.nif
model:subway    = Interface/Lockpicking/LockPickLockV2.nif
model:institute = Interface/Lockpicking/LockPickLockV1.nif

; --- всё остальное по типу
type:DOOR = Interface/Lockpicking/LockPickLock01.nif
type:CONT = Interface/Lockpicking/LockPickLockV3.nif
